name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 校验 Python 命令行
        run: |
          python -m compileall -q skills/super-memory/scripts
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: 安装前端依赖
        working-directory: web
        run: npm ci
      - name: 校验本地接口
        working-directory: web
        run: npm run test:api
      - name: 校验前端
        working-directory: web
        run: |
          npm run lint
          npm run build
